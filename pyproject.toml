[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-integrity-lab"
version = "0.1.0"
description = "Auditable topology diagnostics and conservative CAD repair experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
algebra = ["sympy"]
cad = ["cadquery-ocp"]
notebook = ["jupyterlab", "plotly", "nbformat"]
ui = ["gradio"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "scipy-stubs", "nbclient", "build"]

[project.scripts]
cad-integrity = "cad_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_integrity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cad: requires the optional OCP geometry kernel"]

[tool.mutmut]
paths_to_mutate = ["src/cad_integrity"]
do_not_mutate = [
    "src/cad_integrity/__init__.py",
    "src/cad_integrity/adapters/*",
    "src/cad_integrity/arrays.py",
    "src/cad_integrity/cli.py",
    "src/cad_integrity/errors.py",
    "src/cad_integrity/f2_reduction.py",
    "src/cad_integrity/fixtures.py",
    "src/cad_integrity/models.py",
    "src/cad_integrity/pipeline.py",
    "src/cad_integrity/repair.py",
    "src/cad_integrity/polygonal_cells.py",
    "src/cad_integrity/serialization.py",
    "src/cad_integrity/algebra.py",
    "src/cad_integrity/simplicial.py",
    "src/cad_integrity/topology.py",
    "src/cad_integrity/visualization.py",
]
tests_dir = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src/cad_integrity"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["OCP.*", "sympy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pixi-pycharm = ">=0.0.12,<0.0.13"
mutmut = ">=3.5.0,<4"
atheris = ">=3.0.0,<4"
pythonocc-core = ">=7.9.3,<8"

[tool.pixi.pypi-dependencies]
cad-integrity-lab = { path = ".", editable = true, extras = ["algebra", "cad", "notebook", "ui", "dev"] }

[tool.pixi.tasks]
check-artifacts = "python scripts/verify_artifacts.py"
compile = "python -m compileall -q src tests examples"
test = "python -m pytest --cov=cad_integrity --cov-report=term-missing"
lint = "ruff check src scripts"
typecheck = "mypy"
build = "python -m build"
gradio = "python -m cad_integrity.gradio_app"
