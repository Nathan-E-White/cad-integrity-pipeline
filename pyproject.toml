[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-integrity-lab"
version = "0.1.0"
description = "Auditable topology diagnostics and conservative CAD repair experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
algebra = ["sympy>=1.13,<2"]
cad = ["cadquery-ocp>=7.9.3,<7.10"]
notebook = ["jupyterlab>=4,<5", "plotly>=5.24,<7", "nbformat>=5.10,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "scipy-stubs>=1.15", "nbclient>=0.10,<1", "build>=1.2,<2"]

[project.scripts]
cad-integrity = "cad_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cad_integrity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cad: requires the optional OCP geometry kernel"]

[tool.mutmut]
paths_to_mutate = ["src/cad_integrity"]
do_not_mutate = [
    "src/cad_integrity/__init__.py",
    "src/cad_integrity/adapters/*",
    "src/cad_integrity/arrays.py",
    "src/cad_integrity/cli.py",
    "src/cad_integrity/errors.py",
    "src/cad_integrity/f2_reduction.py",
    "src/cad_integrity/fixtures.py",
    "src/cad_integrity/metrics.py",
    "src/cad_integrity/numerics.py",
    "src/cad_integrity/pipeline.py",
    "src/cad_integrity/repair.py",
    "src/cad_integrity/serialization.py",
    "src/cad_integrity/algebra.py",
    "src/cad_integrity/simplicial.py",
    "src/cad_integrity/visualization.py",
]
tests_dir = ["tests/test_topology_repair.py", "tests/test_polygonal_cell_admission.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
files = ["src/cad_integrity"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["OCP.*", "sympy.*", "plotly.*"]
ignore_missing_imports = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = "3.13.*"
numpy = ">=1.26,<3"
scipy = ">=1.12,<2"
pixi-pycharm = ">=0.0.12,<0.0.13"

[tool.pixi.pypi-dependencies]
cad-integrity-lab = { path = ".", editable = true, extras = ["algebra", "cad", "notebook", "dev"] }

[tool.pixi.tasks]
check-artifacts = "python scripts/verify_artifacts.py"
compile = "python -m compileall -q src tests examples"
test = "python -m pytest --cov=cad_integrity --cov-report=term-missing"
lint = "ruff check src scripts"
typecheck = "mypy"
build = "python -m build"
