    if(ghost){for(let j=0;j<5;j++){const pts=[];for(let i=0;i<50;i++){const x=-2.8+i*.115,y=-1.3+j*.62+.2*Math.sin(i*.32+j),z=.48*Math.sin(x*1.15)*Math.cos(y*1.35)+.72*Math.exp(-(x*x+y*y)*.35)+.04;pts.push(new THREE.Vector3(x,y,z))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:j===2?0x38bdf8:0x81aebe,transparent:true,opacity:j===2?1:.94,depthTest:false,fog:true})))}}

    const comparePeers=viewportControllers.filter(x=>x.canvas.dataset.sync==='compare');if(canvas.dataset.sync==='compare'&&comparePeers.length>1){camera.position.copy(comparePeers[0].camera.position);ctl.target.copy(comparePeers[0].ctl.target);ctl.update()}
    ctl.addEventListener('change',()=>{if(!camerasLinked||syncingCameras||canvas.dataset.sync!=='compare')return;syncingCameras=true;viewportControllers.filter(x=>x!==controller&&x.canvas.dataset.sync==='compare').forEach(peer=>{peer.camera.position.copy(camera.position);peer.camera.quaternion.copy(camera.quaternion);peer.camera.up.copy(camera.up);peer.ctl.target.copy(ctl.target);peer.ctl.update()});syncingCameras=false});

      const gSize=Math.min(70,Math.max(56,r.width*.13)),margin=13,gx=r.width-gSize-margin,gy=margin;
      gnomon.camera.position.copy(camera.position).sub(ctl.target).normalize().multiplyScalar(2.5);gnomon.camera.up.copy(camera.up);gnomon.camera.lookAt(0,0,0);

    }

}
function setProbeBin(bin){
  activeProbeBin=activeProbeBin===bin?-1:bin;const active=activeProbeBin>=0,range=active?probeRange(activeProbeBin):new THREE.Vector2(-2,-1);probeMaterials.forEach(m=>m.uniforms.uProbeRange.value.copy(range));
  document.querySelectorAll('.hist-bin').forEach(n=>n.classList.toggle('active',active&&Number(n.dataset.bin)===activeProbeBin));
  document.querySelectorAll('.probe-status').forEach(n=>{n.classList.toggle('active',active);n.textContent=active?`ISOLATED BIN ${String(activeProbeBin).padStart(2,'0')} · ${range.x.toFixed(3)}–${range.y.toFixed(3)} · WHITE FENCE`:'PROBE OFF · CLICK HISTOGRAM BIN'})
}
function attachInteractions(){

}
