[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nurbs-core-engine"
version = "0.2.0"
description = "NURBS geometry and bounded plane/cylinder extraction from STL"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nathan White"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
step = ["cadquery-ocp>=7.9,<8"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
stl-to-cad = "main:main"

[tool.setuptools]
py-modules = ["NURBSCoreEngine", "STLReader", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["step: requires the optional Open CASCADE backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["originals"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
# Use the active interpreter's version so dependency stubs match the environment.
# Check older supported Python versions in their own resolved environments.
files = ["NURBSCoreEngine.py", "STLReader.py", "main.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
# NumPy/SciPy/OCP contain partially typed numerical and foreign-function APIs.
# This is a baseline check, not a claim of strict static typing.
