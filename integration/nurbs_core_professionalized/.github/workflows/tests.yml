name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mypy
      - run: python -m compileall -q NURBSCoreEngine.py STLReader.py main.py
      - run: pytest --cov=NURBSCoreEngine --cov=STLReader --cov=main
  step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,step]'
      - run: pytest
