[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-healing-extension"
version = "0.1.0"
description = "Cotangent harmonic maps, conservative seam repair, reusable system updates, and STEP exchange"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
step = ["cadquery>=2.8,<3"]
test = ["pytest>=8,<10"]

[project.scripts]
mesh-healing-demo = "example_pipeline:main"

[tool.setuptools]
py-modules = ["mesh_healing_engine", "mesh_export", "example_pipeline"]
