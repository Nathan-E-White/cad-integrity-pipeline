name: Geometry regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: >-
          python -m pip install
          -c requirements/constraints.txt
          -e ./components/topological_delta_audit
          -e ./components/verification_grid
          -e ./components/inspection_workspace
          -e ".[algebra,cad,notebook,ui,dev]"
      - name: Enforce prototype status
        env:
          PROTOTYPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROTOTYPE_FALLBACK_BASE: origin/${{ github.event.repository.default_branch }}
        run: >-
          python scripts/check_prototype_status.py
          --base "$PROTOTYPE_BASE"
          --fallback-base "$PROTOTYPE_FALLBACK_BASE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: python scripts/check_dependencies.py --environment
      - run: python scripts/check_cad_environment.py
      - run: gradio cc build components/topological_delta_audit --no-generate-docs
      - run: gradio cc build components/verification_grid --no-generate-docs
      - run: gradio cc build components/inspection_workspace --no-generate-docs
      - run: python scripts/check_prototype_status.py --check-production-boundary
      - run: python scripts/verify_artifacts.py
      - run: python -m compileall -q src tests examples scripts
      - run: python -m pytest --cov=cad_integrity --cov-report=term-missing
      - run: ruff check src scripts
      - run: mypy
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/cad_integrity_lab-*.whl
      - run: python scripts/check_installed_quad_fixture.py
