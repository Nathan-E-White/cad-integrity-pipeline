name: Geometry regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[algebra,cad,notebook,dev]"
      - run: python scripts/verify_artifacts.py
      - run: python -m compileall -q src tests examples scripts
      - run: python -m pytest --cov=cad_integrity --cov-report=term-missing
      - run: ruff check src scripts
      - run: mypy
      - run: python -m build
# Workflow is supplied, not remotely executed as part of this delivery.
