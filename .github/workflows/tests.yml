name: Geometry regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: >-
          python -m pip install
          -c requirements/constraints.txt
          -e ./components/topological_delta_audit
          -e ./components/verification_grid
          -e ".[algebra,cad,notebook,ui,dev]"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: python scripts/check_dependencies.py --environment
      - run: python scripts/check_cad_environment.py
      - run: gradio cc build components/topological_delta_audit --no-generate-docs
      - run: gradio cc build components/verification_grid --no-generate-docs
      - run: python scripts/verify_artifacts.py
      - run: python -m compileall -q src tests examples scripts
      - run: python -m pytest --cov=cad_integrity --cov-report=term-missing
      - run: ruff check src scripts
      - run: mypy
      - run: python -m build
